name: Sincronizar clin.care — Mês Completo (30 dias)

on:
  workflow_dispatch:
  schedule:
    # Diariamente às 03:00 da madrugada (horário de Salvador/Bahia, UTC-3)
    - cron: '0 6 * * *'

concurrency:
  group: sync-clincare-mes
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache do navegador Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci --prefer-offline --no-audit

      - name: Instalar Chromium (somente se não estiver em cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Instalar libs de sistema do Chromium (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Executar sincronização mensal (30 dias)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLINCARE_URL: ${{ secrets.CLINCARE_URL }}
          CLINCARE_EMAIL: ${{ secrets.CLINCARE_EMAIL }}
          CLINCARE_PASSWORD: ${{ secrets.CLINCARE_PASSWORD }}
          SYNC_MODO: mes
        run: npx tsx scripts/sincronizar-clincare.ts --modo=mes