name: Reservar Horário clin.care (RESERVADO APP)

on:
  workflow_dispatch:

concurrency:
  group: reservar-clincare-fila
  cancel-in-progress: false

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install chromium --with-deps

      - name: Processar fila de reservas no clin.care
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLINCARE_URL: ${{ secrets.CLINCARE_URL }}
          CLINCARE_EMAIL: ${{ secrets.CLINCARE_EMAIL }}
          CLINCARE_PASSWORD: ${{ secrets.CLINCARE_PASSWORD }}
          CLINCARE_SERVICO_PADRAO: ${{ secrets.CLINCARE_SERVICO_PADRAO }}
          CLINCARE_SALA_PADRAO: ${{ secrets.CLINCARE_SALA_PADRAO }}
          SYNC_MODO: reservas
        run: npx tsx scripts/sincronizar-clincare.ts --modo=reservas