name: Sincronizar clin.care — Dia Atual (Rápido)

on:
  workflow_dispatch:
  schedule:
    # A cada 30 min entre 07:00 e 22:00 (horário de Salvador/Bahia, UTC-3)
    - cron: '*/30 10-23,0-1 * * *'

concurrency:
  group: sync-clincare-hoje
  cancel-in-progress: true

jobs:
  sincronizar-hoje:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install chromium --with-deps

      - name: Executar sincronização do dia atual e amanhã
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLINCARE_URL: ${{ secrets.CLINCARE_URL }}
          CLINCARE_EMAIL: ${{ secrets.CLINCARE_EMAIL }}
          CLINCARE_PASSWORD: ${{ secrets.CLINCARE_PASSWORD }}
          SYNC_MODO: hoje
        run: npx tsx scripts/sincronizar-clincare.ts --modo=hoje